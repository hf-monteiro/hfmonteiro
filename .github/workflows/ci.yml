# Quality checks only. Deployment is handled by the Cloudflare Pages
# Git integration, which builds and publishes every push on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, type-check & link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Static export to out/ (Next also runs its own type-check here).
      - run: npm run build

      # Standalone type-check; needs next-env.d.ts, which the build generates.
      - run: npm run typecheck

      # Internal links resolve against out/ (`/labs` -> out/labs.html);
      # external links (e.g. GitHub lab repos) are checked over HTTP.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/out
            --fallback-extensions html
            --exclude 'linkedin\.com'
            --no-progress
            'out/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
